name: Gerar APK

on:
  workflow_dispatch:      # botão "Run workflow" na aba Actions
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícone Newline e tela de abertura
        run: |
          npx capacitor-assets generate --android || echo "Gerador de assets não concluiu; aplicando ícones Newline diretamente."
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const res = path.join('android','app','src','main','res');
          const source = path.join('assets','icon.png');
          if (!fs.existsSync(source)) throw new Error('assets/icon.png não encontrado');
          // PNG quadrado da marca aplicado diretamente em todos os tamanhos do launcher.
          const densities = ['mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi'];
          for (const density of densities) {
            const dir = path.join(res, `mipmap-${density}`);
            fs.mkdirSync(dir, {recursive:true});
            fs.copyFileSync(source, path.join(dir,'ic_launcher.png'));
            fs.copyFileSync(source, path.join(dir,'ic_launcher_round.png'));
          }
          // Remove recursos adaptativos padrão que poderiam sobrepor os PNGs Newline.
          const adaptive = path.join(res,'mipmap-anydpi-v26');
          for (const name of ['ic_launcher.xml','ic_launcher_round.xml']) {
            const file = path.join(adaptive,name);
            if (fs.existsSync(file)) fs.unlinkSync(file);
          }
          const manifest = path.join('android','app','src','main','AndroidManifest.xml');
          let xml = fs.readFileSync(manifest,'utf8');
          xml = xml.replace(/android:icon="[^"]*"/, 'android:icon="@mipmap/ic_launcher"');
          if (/android:roundIcon="[^"]*"/.test(xml)) {
            xml = xml.replace(/android:roundIcon="[^"]*"/, 'android:roundIcon="@mipmap/ic_launcher_round"');
          } else {
            xml = xml.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"');
          }
          xml = xml.replace(/android:label="[^"]*"/, 'android:label="Newline Controle"');
          fs.writeFileSync(manifest,xml);
          console.log('Ícone launcher Newline aplicado diretamente aos recursos Android.');
          NODE

      - name: Aplicar permissões (câmera, internet, HTTP)
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifest = path.join('android', 'app', 'src', 'main', 'AndroidManifest.xml');
          if (!fs.existsSync(manifest)) {
            console.error('AndroidManifest.xml não encontrado após npx cap add android.');
            process.exit(1);
          }
          let xml = fs.readFileSync(manifest, 'utf8');
          const permissions = [
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.CAMERA'
          ];
          const additions = [];
          for (const permission of permissions) {
            if (!xml.includes(`android:name="${permission}"`)) additions.push(`    <uses-permission android:name="${permission}" />`);
          }
          for (const feature of ['android.hardware.camera', 'android.hardware.camera.autofocus']) {
            if (!xml.includes(`android:name="${feature}"`)) additions.push(`    <uses-feature android:name="${feature}" android:required="false" />`);
          }
          if (additions.length) xml = xml.replace('</manifest>', additions.join('\n') + '\n</manifest>');
          if (!xml.includes('android:usesCleartextTraffic')) xml = xml.replace('<application', '<application\n        android:usesCleartextTraffic="true"');
          fs.writeFileSync(manifest, xml);
          console.log('AndroidManifest.xml ajustado.');
          NODE

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: controle-equipamentos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
