<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02301f">
<title>Sem conexão</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#02301f;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
.box{width:100%;max-width:420px;background:#0a4a33;border-radius:16px;padding:28px 22px;box-shadow:0 6px 24px #0004}
.logo{width:82px;height:82px;border-radius:50%;background:#05030e;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
h1{font-size:22px;line-height:1.25;margin:0 0 14px}
p{opacity:.9;font-size:15px;line-height:1.45;margin:0}
button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:8px;font-size:16px;font-weight:600;background:#55b88b;color:#02301f}
</style></head><body>
<main class="box">
  <div class="logo" aria-hidden="true">
    <svg width="48" height="48" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <path fill="#e8bd4e" d="M7 10h50v17H24C14 27 8 20 7 10Z"/>
      <path fill="#e8bd4e" d="M14 31h43v13H29c-8 0-13-5-15-13Z"/>
      <path fill="#e8bd4e" d="M21 48h36v9H34c-7 0-11-4-13-9Z"/>
    </svg>
  </div>
  <h1>Não foi possível conectar</h1>
  <p>Verifique sua conexão com a internet e reinicie o celular. O endereço do servidor está salvo e não pode ser alterado nesta tela.</p>
  <button id="retry" type="button">Tentar novamente</button>
</main>
<script>
(function(){
  const KEY="nl_server";
  function getSaved(){
    try { return JSON.parse(localStorage.getItem(KEY)||"null"); }
    catch(e) { return null; }
  }
  function serverUrl(o){
    if(!o || !o.host) return "";
    return (o.https ? "https://" : "http://") + o.host + (o.port ? ":"+o.port : "") + "/";
  }
  document.getElementById("retry").addEventListener("click",function(){
    const target=serverUrl(getSaved());
    if(target) window.location.replace(target);
    else document.querySelector("p").textContent="Não há servidor salvo. Limpe os dados do aplicativo nas configurações do Android para cadastrar novamente.";
  });
})();
</script></body></html>
